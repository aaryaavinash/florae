<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Florae — a flower a month</title>
  <desc id="desc">An editorial botanical plate: crimson rose on warm paper beside the Florae wordmark.</desc>
